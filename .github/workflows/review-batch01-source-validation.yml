name: Review batch01 source validation
on:
  push:
    branches:
      - codex/review-batch01-validation-20260918
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3015d24161cbb30ef6591db1a6ee4a54c9546223
          persist-credentials: false
      - name: Set up locked Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@22.19.0
          install: false
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Archive offline test dependencies
        run: |
          mkdir -p offline-bin
          cp "$(command -v node)" offline-bin/node
          cp "$(command -v pnpm)" offline-bin/pnpm
          tar -czf reviewed-dependencies.tar.gz node_modules server/node_modules apps/admin-web/node_modules apps/workbench-web/node_modules packages/*/node_modules offline-bin
      - name: Prepare isolated PostgreSQL test binaries
        run: |
          mkdir pg-offline
          docker run --rm -v "$PWD/pg-offline:/export" postgres:17-bookworm bash -ceu '
            mkdir -p /export/lib
            cp -a /usr/lib/postgresql/17 /export/postgresql
            cp -a /usr/share/postgresql/17 /export/share
            for binary in /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so; do
              ldd "$binary" 2>/dev/null || true
            done | awk "/=> \\// {print \$3}" | sort -u | while read library; do
              case "$(basename "$library")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue;; esac
              cp -L "$library" /export/lib/
            done
            chmod -R a+rX /export
          '
          tar -czf reviewed-postgres.tar.gz pg-offline
      - name: Upload test dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-offline-dependencies
          path: |
            reviewed-dependencies.tar.gz
            reviewed-postgres.tar.gz
          retention-days: 1
          if-no-files-found: error
