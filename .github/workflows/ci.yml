name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent jobs run in parallel; integration and browser tests are split across several machines. Server tests are selected by file name:
# *.integration.test.ts → test:integration (PostgreSQL), other *.test.ts → test:unit.
jobs:
  static:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        run: bash scripts/ci/deploy.sh

      - name: Run static checks, type checks, lint and build
        run: pnpm ci:static

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server and frontend unit tests
        run: pnpm ci:unit

  # 集成测试逐个文件串行（每个文件自建可丢弃数据库），按文件分到两台机器，见 run-server-tests.mjs --shard。
  integration:
    name: PostgreSQL integration tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh_work
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dsh_work_m3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_work -d dsh_work_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all server integration suites
        run: pnpm test:integration --shard=${{ matrix.shard }}

  # P0 冒烟（内存夹具，套件内串行）按测试文件用 Playwright --shard 分到两台机器，每台各起一份冒烟服务与 Vite；
  # 11 个 P1 套件按耗时分成员工端（3 套）与身份/管理端（8 套）两组，各一台机器，组内套件并行
  # （每套各自的服务与可丢弃数据库）。两组合起来等于 test:e2e:p1。
  browser:
    name: Browser tests (${{ matrix.suite }} ${{ matrix.shard || matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: p0
            shard: 1/2
          - suite: p0
            shard: 2/2
          - suite: p1
            group: workbench
          - suite: p1
            group: admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh_work
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dsh_work_m3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_work -d dsh_work_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 全部套件写在一份 playwright.config.ts 里，每个套件一个 project。钉钉套件使用假钉钉开放平台，不是真实钉钉验收。
      - name: Run P0 browser smoke tests
        if: matrix.suite == 'p0'
        run: pnpm test:e2e --shard=${{ matrix.shard }}

      - name: Run P1 browser journeys (workbench)
        if: matrix.suite == 'p1' && matrix.group == 'workbench'
        run: pnpm test:e2e:p1:workbench

      - name: Run P1 browser journeys (identity and admin)
        if: matrix.suite == 'p1' && matrix.group == 'admin'
        run: pnpm test:e2e:p1:admin

      # 任一浏览器套件失败时上传 Playwright 结果，便于事后定位偶发失败：只为失败的用例保留 trace 与截图，
      # HTML 报告包含这台机器上运行的全部套件。内容均为测试夹具的合成数据与 CI 专用身份。
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ matrix.suite }}-${{ matrix.group || strategy.job-index }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
