# dsh-work ACP deployment overlay. The upstream ACP example owns the model,
# tools and sandbox composition; this overlay adds the same DSH-managed settings
# and credential providers used by the product UI. Secrets remain in DSH_HOME.
- id: base
  name: cordis:include
  config:
    # Local development fallback. The installation resolver writes a generated
    # copy with this path replaced by the verified Runtime's absolute config.
    path: ../../../../deepseek-harness/examples/acp-agent/cordis.yml
    patches:
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? process.env.DSH_WORK_DSH_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          persona: !!js "process.env.DSH_AGENT_SYSTEM_PROMPT ?? 'You are the dsh-work enterprise assistant.'"
      - insert:
          - id: settings
            name: '@deepseek-ai/dsh-settings-file'
          - id: credentials
            name: '@deepseek-ai/dsh-credentials-local'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # The plugin requires this flag. Keep search results deterministic
              # for enterprise runs instead of sampling when a glob exceeds its cap.
              sampleOverCapGlobResults: false
          - id: dsh-work-tool-policy
            # Replaced with an absolute path in the generated deployment overlay.
            name: __DSH_WORK_TOOL_POLICY_MODULE__
